<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
  <title id="title">Chittransh Sharma</title>
  <desc id="desc">Animated dark banner with violet and cyan flowing light</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#17112E"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#8B5CF6"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
    <linearGradient id="text"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1000" height="290" rx="24" fill="url(#bg)"/>
  <circle cx="850" cy="65" r="100" fill="#8B5CF6" opacity=".12"><animate attributeName="r" values="90;130;90" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="230" r="105" fill="#22D3EE" opacity=".08"><animate attributeName="r" values="105;75;105" dur="6s" repeatCount="indefinite"/></circle>
  <path d="M0 222 C180 140 300 285 500 190 S800 120 1000 185" fill="none" stroke="url(#line)" stroke-width="22" opacity=".27" filter="url(#glow)"/>
  <path d="M0 222 C180 140 300 285 500 190 S800 120 1000 185" fill="none" stroke="url(#line)" stroke-width="2" stroke-dasharray="150 850"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="6s" repeatCount="indefinite"/></path>
  <text x="500" y="78" fill="#67E8F9" text-anchor="middle" font-family="monospace" font-size="15" letter-spacing="5">ENGINEER • BUILDER • CO-FOUNDER</text>
  <text x="500" y="150" fill="url(#text)" text-anchor="middle" font-family="Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">CHITTRANSH SHARMA</text>
  <text x="500" y="187" fill="#A5B4FC" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="2">BACKEND SYSTEMS / APPLIED AI / FULL-STACK DELIVERY</text>
  <circle cx="500" cy="238" r="4" fill="#67E8F9"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>

