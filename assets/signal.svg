<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 32" role="img" aria-label="Animated signal divider">
  <defs><linearGradient id="g"><stop stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".3" stop-color="#8B5CF6"/><stop offset=".7" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs>
  <path d="M0 16 H1000" stroke="url(#g)" stroke-width="1" opacity=".5"/>
  <path d="M0 16 H1000" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="90 910"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="5s" repeatCount="indefinite"/></path>
  <circle cy="16" r="4" fill="#67E8F9"><animate attributeName="cx" from="0" to="1000" dur="5s" repeatCount="indefinite"/></circle>
</svg>

